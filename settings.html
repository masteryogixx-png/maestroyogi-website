<section class="gallery-admin">

<div class="container">

<div class="admin-form">

<h2>Website Information</h2>

<form>

<input type="text" placeholder="Website Name">

<input type="email" placeholder="Website Email">

<input type="tel" placeholder="Contact Number">

<input type="text" placeholder="Address">

<input type="url" placeholder="Facebook URL">

<input type="url" placeholder="Instagram URL">

<input type="url" placeholder="YouTube URL">

<textarea placeholder="Website Description"></textarea>

<button type="submit">

Save Settings

</button>

</form>

</div>

<div class="admin-form">

<h2>Administrator</h2>

<form>

<input type="text" placeholder="Admin Name">

<input type="email" placeholder="Admin Email">

<input type="password" placeholder="New Password">

<input type="password" placeholder="Confirm Password">

<button type="submit">

Update Account

</button>

</form>

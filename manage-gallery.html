Upload, edit and delete gallery images.

</p>

<section class="dashboard">

<div class="container">

<div class="dashboard-card">

<h2>Upload New Image</h2>

<form id="galleryForm">

<input
type="file"
id="galleryImage"
accept="image/*"
required>

<input
type="text"
id="galleryTitle"
placeholder="Image Title"
required>

<textarea placeholder="Image Description"></textarea>

<button type="submit">

Upload Image

</button>

</form>

</div>

<div class="dashboard-card">

<h2>Gallery Images</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Image</th>

<th>Title</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>1</td>

<td>gallery1.jpg</td>

<td>Yoga Camp</td>

<td>

<button>Edit</button>

<button>Delete</button>

</td>

</tr>

<tr>

<td>2</td>

<td>gallery2.jpg</td>

<td>Meditation Session</td>

<td>

<button>Edit</button>

<button>Delete</button>

</td>

</tr>

</tbody>

</table>
